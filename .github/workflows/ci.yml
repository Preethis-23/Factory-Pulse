name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Lint
        run: echo "lint ok"
      - name: Test
        run: echo "tests ok"
      - name: Build Docker
        run: docker compose config